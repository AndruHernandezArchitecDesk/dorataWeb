services:
  - type: web
    name: dorata-backend
    env: node
    plan: free
    buildCommand: npm --prefix dorata-backend install && npm --prefix dorata-backend run prisma:generate && npm --prefix dorata-backend run build
    startCommand: node dorata-backend/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /health
