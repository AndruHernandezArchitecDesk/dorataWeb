services:
  - type: web
    name: dorata-backend
    env: node
    plan: free
    buildCommand: cd dorata-backend && npm install && npx prisma generate && npx prisma migrate deploy && npm run build && npm run seed || true
    startCommand: cd dorata-backend && node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /health
