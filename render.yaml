services:
  - type: web
    name: dorata-backend
    env: node
    plan: free
    buildCommand: cd dorata-backend && npm install && npx prisma generate && npm run build
    startCommand: cd dorata-backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /health
